name: Lighthouse CI

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Build static site
        run: npm run build

      - name: Start static server
        run: npx serve out -p 4444 &

      - name: Run Lighthouse (mobile)
        run: |
          sleep 3
          npx lighthouse http://localhost:4444 \
            --only-categories=performance \
            --emulated-form-factor=mobile \
            --output=json \
            --output-path=/tmp/lh-mobile.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet

      - name: Run Lighthouse (desktop)
        run: |
          npx lighthouse http://localhost:4444 \
            --only-categories=performance \
            --emulated-form-factor=desktop \
            --output=json \
            --output-path=/tmp/lh-desktop.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            function parseReport(path) {
              const r = JSON.parse(fs.readFileSync(path, 'utf8'));
              const a = r.audits;
              return {
                perf: Math.round(r.categories.performance.score * 100),
                lcp:  a['largest-contentful-paint'],
                fcp:  a['first-contentful-paint'],
                tbt:  a['total-blocking-time'],
                cls:  a['cumulative-layout-shift'],
                si:   a['speed-index'],
              };
            }

            function scoreEmoji(n) {
              return n >= 90 ? '🟢' : n >= 50 ? '🟠' : '🔴';
            }

            function metricEmoji(score) {
              return score >= 0.9 ? '🟢' : score >= 0.5 ? '🟠' : '🔴';
            }

            const mobile  = parseReport('/tmp/lh-mobile.json');
            const desktop = parseReport('/tmp/lh-desktop.json');

            const body = [
              `<!-- lighthouse-ci -->`,
              `## Lighthouse Performance`,
              ``,
              `| | 📱 Mobile | 🖥️ Desktop |`,
              `|---|---|---|`,
              `| **Score** | ${scoreEmoji(mobile.perf)} **${mobile.perf}** | ${scoreEmoji(desktop.perf)} **${desktop.perf}** |`,
              `| LCP | ${mobile.lcp.displayValue} ${metricEmoji(mobile.lcp.score)} | ${desktop.lcp.displayValue} ${metricEmoji(desktop.lcp.score)} |`,
              `| FCP | ${mobile.fcp.displayValue} ${metricEmoji(mobile.fcp.score)} | ${desktop.fcp.displayValue} ${metricEmoji(desktop.fcp.score)} |`,
              `| TBT | ${mobile.tbt.displayValue} ${metricEmoji(mobile.tbt.score)} | ${desktop.tbt.displayValue} ${metricEmoji(desktop.tbt.score)} |`,
              `| CLS | ${mobile.cls.displayValue} ${metricEmoji(mobile.cls.score)} | ${desktop.cls.displayValue} ${metricEmoji(desktop.cls.score)} |`,
              `| Speed Index | ${mobile.si.displayValue} ${metricEmoji(mobile.si.score)} | ${desktop.si.displayValue} ${metricEmoji(desktop.si.score)} |`,
              ``,
              `> Měřeno lokálně (bez síťové latence) — produkční skóre bude nižší.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('<!-- lighthouse-ci -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
